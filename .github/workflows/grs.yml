name: Update Profile README Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight UTC
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@b4d2ef3b8051484b318d455163153b23a2b35fa2 # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=percentile&hide_border=true&theme=transparent&custom_title=GitHub%20Activity
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@b4d2ef3b8051484b318d455163153b23a2b35fa2 # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html,css&hide_border=true&theme=transparent&custom_title=Core%20Languages
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Intentionally fixed to my repos to support featured profile pins.
      - name: Generate featured pin card 1
        uses: readme-tools/github-readme-stats-action@b4d2ef3b8051484b318d455163153b23a2b35fa2 # v1
        with:
          card: pin
          options: username=zhittsova&repo=agri-weather-yield-drivers&show_owner=false&hide_border=true&theme=transparent
          path: profile/pin-agri-weather-yield-drivers.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate featured pin card 2
        uses: readme-tools/github-readme-stats-action@b4d2ef3b8051484b318d455163153b23a2b35fa2 # v1
        with:
          card: pin
          options: username=zhittsova&repo=bi-python-uv-project-scaffolder&show_owner=false&hide_border=true&theme=transparent
          path: profile/pin-bi-python-uv-project-scaffolder.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated cards artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: profile-cards
          path: profile/*.svg
          if-no-files-found: error

  create-cards-pr:
    needs: generate-cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Download generated cards artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: profile-cards
          path: profile

      - name: Create or update cards PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            profile/*.svg
          commit-message: "chore(profile): update README cards"
          title: "chore(profile): update README cards"
          body: |
            Automated update of profile README card SVG assets.
          branch: "ci/update-readme-cards"
          base: "main"
          delete-branch: false
