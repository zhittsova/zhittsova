name: Update Profile README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "profile/**"
      - ".github/workflows/grs.yml"
      - ".github/scripts/*profile*"

concurrency:
  group: update-readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test card generation and validation
        run: python -m unittest discover -s .github/scripts -p 'test_profile_cards.py'

      - name: Generate cards from public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate-profile-cards.py

      - name: Validate generated cards
        run: python .github/scripts/validate-profile-cards.py profile/*.svg

      - name: Upload generated cards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-cards
          path: profile/*.svg
          if-no-files-found: error

  create-cards-pr:
    needs: generate-cards
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated cards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: profile-cards
          path: profile

      - name: Create or update cards PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          add-paths: |
            profile/*.svg
          commit-message: "chore: refresh profile cards"
          title: "chore: refresh profile cards"
          body: "Refresh the profile cards from the GitHub API."
          branch: "ci/update-readme-cards"
          base: "main"
          delete-branch: false
