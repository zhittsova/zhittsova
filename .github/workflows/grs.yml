name: Update Profile README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "profile/**"
      - ".github/workflows/grs.yml"
      - ".github/scripts/*profile*"

concurrency:
  group: update-readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            card: stats
            options: username=zhittsova&show_icons=true&include_all_commits=true&hide_rank=true&hide_border=true&bg_color=0f1617&title_color=42c8a5&text_color=e8f2ec&icon_color=42c8a5&custom_title=Public%20GitHub%20activity
          - name: top-langs
            card: top-langs
            options: username=zhittsova&layout=compact&langs_count=8&hide=html,css&hide_border=true&bg_color=0f1617&title_color=42c8a5&text_color=e8f2ec&custom_title=Languages%20in%20public%20repositories
          - name: pin-agri-weather-yield-drivers
            card: pin
            options: username=zhittsova&repo=agri-weather-yield-drivers&show_owner=false&hide_border=true&bg_color=0f1617&title_color=42c8a5&text_color=e8f2ec&icon_color=42c8a5
          - name: pin-bi-python-uv-project-scaffolder
            card: pin
            options: username=zhittsova&repo=bi-python-uv-project-scaffolder&show_owner=false&hide_border=true&bg_color=0f1617&title_color=42c8a5&text_color=e8f2ec&icon_color=42c8a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test SVG validation
        run: python -m unittest discover -s .github/scripts -p 'test_profile_cards.py'

      # Render inside this job; no dependency on the public Vercel image service.
      - name: Generate card from the GitHub API
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: ${{ matrix.card }}
          options: ${{ matrix.options }}
          path: profile/${{ matrix.name }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.1.3"
          fail_on_error: "true"

      - name: Validate generated card
        env:
          CARD_PATH: profile/${{ matrix.name }}.svg
        run: python .github/scripts/validate-profile-cards.py "$CARD_PATH"

      - name: Upload generated card
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-cards-${{ matrix.name }}
          path: profile/${{ matrix.name }}.svg
          if-no-files-found: error

  create-cards-pr:
    needs: generate-cards
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated cards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: profile-cards-*
          merge-multiple: true
          path: profile

      - name: Create or update cards PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          add-paths: |
            profile/*.svg
          commit-message: "chore: refresh profile cards"
          title: "chore: refresh profile cards"
          body: "Refresh the profile cards from the GitHub API."
          branch: "ci/update-readme-cards"
          base: "main"
          delete-branch: false
