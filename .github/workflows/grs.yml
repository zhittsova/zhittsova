name: Update Profile README Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/grs.yml"
      - ".github/scripts/generate-profile-cards.py"
      - ".github/scripts/card-unavailable-template.svg"

concurrency:
  group: update-readme-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Generate cards
        env:
          OWNER: ${{ github.repository_owner }}
          RETRY_COUNT: ${{ vars.CARDS_RETRY_COUNT || '2' }}
          RETRY_DELAY_SECONDS: ${{ vars.CARDS_RETRY_DELAY_SECONDS || '2' }}
          ALLOW_PLACEHOLDER_FALLBACK: ${{ vars.CARDS_ALLOW_PLACEHOLDER_FALLBACK || '1' }}
          FAIL_ON_GENERATOR_ERRORS: ${{ vars.CARDS_FAIL_ON_GENERATOR_ERRORS || vars.CARDS_STRICT_REUSE_ON_GENERATOR_ERRORS || (github.event_name == 'pull_request' && '1' || '0') }}
        run: python .github/scripts/generate-profile-cards.py

      - name: Upload generated cards artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-cards
          path: profile/*.svg
          if-no-files-found: error

  create-cards-pr:
    needs: generate-cards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Download generated cards artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: profile-cards
          path: profile

      - name: Create or update cards PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          add-paths: |
            profile/*.svg
          commit-message: "chore(profile): update README cards"
          title: "chore(profile): update README cards"
          body: |
            Automated update of profile README card SVG assets.
          branch: "ci/update-readme-cards"
          base: "main"
          delete-branch: false
