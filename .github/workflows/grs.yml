name: Update Profile README Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/grs.yml"
      - ".github/scripts/generate-profile-cards.sh"

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Generate cards
        env:
          OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/generate-profile-cards.sh

      - name: Upload generated cards artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: profile-cards
          path: profile/*.svg
          if-no-files-found: error

  create-cards-pr:
    needs: generate-cards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Download generated cards artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: profile-cards
          path: profile

      - name: Create or update cards PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            profile/*.svg
          commit-message: "chore(profile): update README cards"
          title: "chore(profile): update README cards"
          body: |
            Automated update of profile README card SVG assets.
          branch: "ci/update-readme-cards"
          base: "main"
          delete-branch: false
