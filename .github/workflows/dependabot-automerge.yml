name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "30 6 * * *" # Daily at 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    if: |
      github.event_name != 'pull_request_target' ||
      (
        contains(fromJSON('["dependabot[bot]","app/dependabot"]'), github.actor) &&
        (
          startsWith(github.head_ref, 'dependabot/github_actions/') ||
          startsWith(github.head_ref, 'dependabot/github-actions/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Enable auto-merge for mature Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: bash .github/scripts/dependabot-automerge.sh
